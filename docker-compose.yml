services:
  metatrain:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/metatrain.db
    volumes:
      - metatrain_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sqlite3; sqlite3.connect(\"/app/data/metatrain.db\").execute(\"SELECT 1\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  metatrain_data:
