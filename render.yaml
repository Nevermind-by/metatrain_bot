services:
  - type: web
    name: metatrain-bot
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: data/metatrain.db
      - key: WEBHOOK_SECRET
        sync: false
