<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MetaTrain</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main>
<section id="home" class="screen active"><h1 id="greeting">MetaTrain</h1><div class="muted" style="margin-bottom:20px">Сегодня</div><section class="card"><div class="muted">Калории</div><div class="calories"><span id="calories">—</span> <small id="calorieTarget"></small></div><div class="bar"><div class="fill" id="calorieFill"></div></div><div class="macros"><div class="macro"><strong id="protein">—</strong><span>Белки</span></div><div class="macro"><strong id="fat">—</strong><span>Жиры</span></div><div class="macro"><strong id="carbs">—</strong><span>Углеводы</span></div></div></section><section class="card stats"><div class="stat"><strong id="weight">—</strong><span>Текущий вес</span></div><div class="stat"><strong id="workouts">—</strong><span>Тренировок за 7 дней</span></div></section><section class="card actions"><button onclick="show('food')">🍽 Питание</button><button onclick="show('workouts')">🏋️ Тренировки</button><button onclick="show('weights')">⚖️ Вес</button><button onclick="show('progress')">📈 Прогресс</button></section></section>
<section id="food" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Питание</h2><div class="card"><div id="foodList" class="empty">Загрузка…</div></div></section>
<section id="workouts" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Тренировки</h2><div id="workoutList" class="card empty">Загрузка…</div><div class="card form"><input id="workoutName" placeholder="Название тренировки"><input id="workoutNotes" placeholder="Заметки"><button onclick="addWorkout()">Начать тренировку</button><div id="workoutMsg"></div></div><div id="activeWorkout"></div></section>
<section id="weights" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Вес</h2><div class="card"><div id="weightList" class="empty">Загрузка…</div></div><div class="card form"><input id="weightInput" type="number" min="1" max="300" step="0.1" placeholder="Вес, кг"><button onclick="addWeight()">Записать вес</button><div id="weightMsg"></div></div></section>
<section id="progress" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Прогресс</h2><div class="card"><div class="muted" style="margin-bottom:10px">Выбери упражнение</div><div id="exerciseChoices" class="exercise-list"><span class="small">Загрузка упражнений…</span></div><input id="progressExercise" list="exerciseDatalist" placeholder="Или введи название упражнения" style="margin-top:12px"><datalist id="exerciseDatalist"></datalist><button onclick="loadProgress()" style="margin-top:10px">Показать прогресс</button></div><div id="progressResult"></div></section><div id="error" class="error"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
