<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MetaTrain</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:20px 16px calc(24px + env(safe-area-inset-bottom))}main{max-width:560px;margin:auto}.screen{display:none}.screen.active{display:block}h1{font-size:28px;margin:0 0 4px}h2{font-size:24px;margin:0 0 18px}.muted,.small{color:var(--tg-theme-hint-color,#777)}.card{background:var(--tg-theme-secondary-bg-color,#f3f3f3);border-radius:18px;padding:18px;margin-bottom:14px}.calories{font-size:34px;font-weight:700}.bar{height:9px;background:rgba(127,127,127,.2);border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;background:var(--tg-theme-button-color,#2481cc);border-radius:99px}.macros,.stats,.actions{display:grid;gap:10px}.macros{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.macro strong,.stat strong{display:block}.macro strong{font-size:18px}.stat strong{font-size:24px}.macro span,.stat span{font-size:12px;color:var(--tg-theme-hint-color,#777)}button,input{width:100%;border:0;border-radius:14px;padding:14px 12px;font-size:15px}button{font-weight:600;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.back{background:var(--tg-theme-secondary-bg-color,#f3f3f3);color:var(--tg-theme-text-color,#111);margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.15)}.row:last-child{border-bottom:0}.form{display:grid;gap:10px}.error{color:#d33}.ok{color:#198754}.empty{text-align:center;padding:20px 0;color:var(--tg-theme-hint-color,#777)}.exercise{padding:14px 0;border-bottom:1px solid rgba(127,127,127,.15)}.exercise:last-child{border-bottom:0}.setrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:8px}.setrow input{padding:10px}.danger{background:#b42318}.done{margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:rgba(127,127,127,.1);border-radius:14px;padding:12px}.metric strong{display:block;font-size:20px}.metric span{font-size:11px;color:var(--tg-theme-hint-color,#777)}.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding:12px 4px 4px}.baritem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}.barvalue{width:100%;max-width:28px;background:var(--tg-theme-button-color,#2481cc);border-radius:6px 6px 2px 2px;min-height:3px}.barlabel{font-size:9px;color:var(--tg-theme-hint-color,#777);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45px}.exercise-list{display:flex;flex-wrap:wrap;gap:8px}.exercise-chip{width:auto;padding:9px 12px;background:rgba(127,127,127,.12);color:var(--tg-theme-text-color,#111)}.exercise-chip.selected{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
</style>
</head>
<body><main>
<section id="home" class="screen active"><h1 id="greeting">MetaTrain</h1><div class="muted" style="margin-bottom:20px">Сегодня</div><section class="card"><div class="muted">Калории</div><div class="calories"><span id="calories">—</span> <small id="calorieTarget"></small></div><div class="bar"><div class="fill" id="calorieFill"></div></div><div class="macros"><div class="macro"><strong id="protein">—</strong><span>Белки</span></div><div class="macro"><strong id="fat">—</strong><span>Жиры</span></div><div class="macro"><strong id="carbs">—</strong><span>Углеводы</span></div></div></section><section class="card stats"><div class="stat"><strong id="weight">—</strong><span>Текущий вес</span></div><div class="stat"><strong id="workouts">—</strong><span>Тренировок за 7 дней</span></div></section><section class="card actions"><button onclick="show('food')">🍽 Питание</button><button onclick="show('workouts')">🏋️ Тренировки</button><button onclick="show('weights')">⚖️ Вес</button><button onclick="show('progress')">📈 Прогресс</button></section></section>
<section id="food" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Питание</h2><div class="card"><div id="foodList" class="empty">Загрузка…</div></div></section>
<section id="workouts" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Тренировки</h2><div id="workoutList" class="card empty">Загрузка…</div><div class="card form"><input id="workoutName" placeholder="Название тренировки"><input id="workoutNotes" placeholder="Заметки"><button onclick="addWorkout()">Начать тренировку</button><div id="workoutMsg"></div></div><div id="activeWorkout"></div></section>
<section id="weights" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Вес</h2><div class="card"><div id="weightList" class="empty">Загрузка…</div></div><div class="card form"><input id="weightInput" type="number" min="1" max="300" step="0.1" placeholder="Вес, кг"><button onclick="addWeight()">Записать вес</button><div id="weightMsg"></div></div></section>
<section id="progress" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Прогресс</h2><div class="card"><div class="muted" style="margin-bottom:10px">Выбери упражнение</div><div id="exerciseChoices" class="exercise-list"><span class="small">Загрузка упражнений…</span></div><input id="progressExercise" list="exerciseDatalist" placeholder="Или введи название упражнения" style="margin-top:12px"><datalist id="exerciseDatalist"></datalist><button onclick="loadProgress()" style="margin-top:10px">Показать прогресс</button></div><div id="progressResult"></div></section><div id="error" class="error"></div>
</main>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';const headers={'X-Telegram-Init-Data':initData};let activeWorkoutId=null;let knownExercises=[];
function set(id,v){document.getElementById(id).textContent=v}
function show(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(name).classList.add('active');if(name==='food')loadFood();if(name==='workouts')loadWorkouts();if(name==='weights')loadWeights();if(name==='progress')loadExerciseChoices()}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){if(!initData){set('error','Открой приложение внутри Telegram.');return}try{const[me,d]=await Promise.all([api('/api/me'),api('/api/dashboard')]);set('greeting',`Привет, ${me.first_name||me.username||'спортсмен'} 👋`);set('calories',Math.round(d.calories.current));set('calorieTarget',`/ ${Math.round(d.calories.target||0)} ккал`);set('protein',`${Math.round(d.protein.current)} / ${Math.round(d.protein.target||0)} г`);set('fat',`${Math.round(d.fat.current)} / ${Math.round(d.fat.target||0)} г`);set('carbs',`${Math.round(d.carbohydrates.current)} / ${Math.round(d.carbohydrates.target||0)} г`);set('weight',d.weight_kg==null?'—':`${d.weight_kg} кг`);set('workouts',d.workouts_last_7_days);const t=d.calories.target||0;document.getElementById('calorieFill').style.width=`${Math.min(100,t?d.calories.current/t*100:0)}%`}catch(e){set('error','Не удалось загрузить данные.')}}
async function loadFood(){try{const d=await api('/api/food/today'),el=document.getElementById('foodList');if(!d.items.length){el.textContent='Сегодня ещё ничего не записано.';return}el.innerHTML=d.items.map(x=>`<div class="row"><span>${x.product_name}<br><small>${x.meal}, ${x.grams} г</small></span><strong>${Math.round(x.calories)} ккал</strong></div>`).join('')}catch(e){set('foodList','Не удалось загрузить питание.')}}
async function loadWorkouts(){try{const d=await api('/api/workouts'),el=document.getElementById('workoutList');if(!d.items.length){el.textContent='Тренировок пока нет.';return}el.className='card';el.innerHTML=d.items.map(x=>`<div class="row"><button onclick="openWorkout(${x.id})">${x.name}</button><span>${new Date(x.performed_at).toLocaleDateString('ru-RU')}</span></div>`).join('')}catch(e){set('workoutList','Не удалось загрузить тренировки.')}}
async function addWorkout(){const msg=document.getElementById('workoutMsg');try{const x=await api('/api/workouts',{method:'POST',body:JSON.stringify({name:workoutName.value,notes:workoutNotes.value||null})});activeWorkoutId=x.id;msg.className='ok';msg.textContent='Тренировка создана ✓';workoutName.value='';workoutNotes.value='';await loadWorkouts();await openWorkout(activeWorkoutId)}catch(e){msg.className='error';msg.textContent='Не удалось создать тренировку.'}}
async function openWorkout(id){activeWorkoutId=id;const d=await api(`/api/workouts/${id}`),el=document.getElementById('activeWorkout');el.innerHTML=`<div class="card"><h3>${d.workout.name}</h3><div id="exerciseList">${d.exercises.map(renderExercise).join('')||'<div class="empty">Упражнений пока нет.</div>'}</div><div class="form" style="margin-top:12px"><input id="exerciseName" placeholder="Новое упражнение"><button onclick="addExercise()">Добавить упражнение</button></div><div class="form done"><input id="duration" type="number" min="1" placeholder="Длительность, минут"><input id="burned" type="number" min="0" placeholder="Потрачено ккал"><button onclick="completeWorkout()">Завершить тренировку</button></div></div>`}
function renderExercise(x){const sets=x.sets||[];return `<div class="exercise"><strong>${x.exercise.name}</strong><div>${sets.map(s=>`<div class="row"><span>Подход ${s.set_number}: ${s.weight_kg} кг × ${s.reps}${s.rpe==null?'':` · RPE ${s.rpe}`}</span><button class="danger" onclick="deleteSet(${s.id})">×</button></div>`).join('')||'<div class="small">Подходов пока нет.</div>'}</div><div class="setrow"><input id="w-${x.exercise.id}" type="number" min="0" step="0.5" placeholder="кг"><input id="r-${x.exercise.id}" type="number" min="1" placeholder="повт."><input id="rpe-${x.exercise.id}" type="number" min="1" max="10" step="0.5" placeholder="RPE"><button onclick="addSet(${x.exercise.id})">+</button></div></div>`}
async function addExercise(){const name=document.getElementById('exerciseName').value.trim();if(!name||!activeWorkoutId)return;await api('/api/workouts/exercises',{method:'POST',body:JSON.stringify({workout_id:activeWorkoutId,name,position:document.querySelectorAll('.exercise').length+1})});document.getElementById('exerciseName').value='';await openWorkout(activeWorkoutId)}
async function addSet(id){const w=document.getElementById(`w-${id}`),r=document.getElementById(`r-${id}`),rpe=document.getElementById(`rpe-${id}`);const d=await api(`/api/workouts/${activeWorkoutId}`),ex=d.exercises.find(x=>x.exercise.id===id);if(!w.value||!r.value)return;await api('/api/workouts/sets',{method:'POST',body:JSON.stringify({exercise_id:id,set_number:(ex.sets||[]).length+1,weight_kg:+w.value,reps:+r.value,rpe:rpe.value?+rpe.value:null})});await openWorkout(activeWorkoutId)}
async function deleteSet(id){if(!confirm('Удалить подход?'))return;await api(`/api/workouts/sets/${id}`,{method:'DELETE'});await openWorkout(activeWorkoutId)}
async function completeWorkout(){const duration=document.getElementById('duration').value,burned=document.getElementById('burned').value;try{await api(`/api/workouts/${activeWorkoutId}/complete`,{method:'POST',body:JSON.stringify({duration_minutes:duration?+duration:null,calories_burned:burned?+burned:null})});activeWorkoutId=null;document.getElementById('activeWorkout').innerHTML='';await loadWorkouts();await load()}catch(e){set('error','Не удалось завершить тренировку.')}}
async function loadWeights(){try{const d=await api('/api/weights'),el=document.getElementById('weightList');if(!d.items.length){el.textContent='История веса пуста.';return}el.innerHTML=d.items.map(x=>`<div class="row"><span>${new Date(x.measured_at).toLocaleDateString('ru-RU')}</span><strong>${x.weight_kg} кг</strong></div>`).join('')}catch(e){set('weightList','Не удалось загрузить вес.')}}
async function addWeight(){const msg=document.getElementById('weightMsg');try{await api('/api/weights',{method:'POST',body:JSON.stringify({weight_kg:+weightInput.value})});msg.className='ok';msg.textContent='Вес записан ✓';weightInput.value='';await loadWeights();await load()}catch(e){msg.className='error';msg.textContent='Не удалось записать вес.')}}
async function loadExerciseChoices(){const choices=document.getElementById('exerciseChoices');try{const d=await api('/api/workouts');const names=new Map();for(const workout of d.items){try{const detail=await api(`/api/workouts/${workout.id}`);for(const item of detail.exercises||[]){const name=item.exercise.name.trim();if(name)names.set(name.toLowerCase(),name)}}catch(e){}}knownExercises=[...names.values()].sort((a,b)=>a.localeCompare(b,'ru'));choices.innerHTML=knownExercises.length?knownExercises.map(name=>`<button class="exercise-chip" onclick="selectExercise(${JSON.stringify(name)})">${escapeHtml(name)}</button>`).join(''):'<span class="small">Упражнений пока нет. Добавь их в тренировке.</span>';document.getElementById('exerciseDatalist').innerHTML=knownExercises.map(name=>`<option value="${escapeAttr(name)}"></option>`).join('')}catch(e){choices.innerHTML='<span class="error">Не удалось загрузить упражнения.</span>'}}
function selectExercise(name){document.getElementById('progressExercise').value=name;document.querySelectorAll('.exercise-chip').forEach(x=>x.classList.toggle('selected',x.textContent===name));loadProgress()}
function escapeHtml(value){return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(value){return escapeHtml(value)}
async function loadProgress(){const name=document.getElementById('progressExercise').value.trim();if(!name)return;const el=document.getElementById('progressResult');el.innerHTML='<div class="card">Загрузка…</div>';try{const d=await api(`/api/workouts/progress/${encodeURIComponent(name)}`);const sets=d.sets||[];if(!sets.length){el.innerHTML='<div class="card empty">По этому упражнению пока нет данных.</div>';return}const max=Math.max(...sets.map(s=>Number(s.weight_kg)||0),1),recent=sets.slice(0,12).reverse();el.innerHTML=`<div class="card"><h3>${escapeHtml(d.exercise)}</h3><div class="metrics"><div class="metric"><strong>${d.best_weight??'—'}</strong><span>Лучший вес, кг</span></div><div class="metric"><strong>${d.best_volume??'—'}</strong><span>Лучший объём, кг</span></div><div class="metric"><strong>${d.estimated_1rm??'—'}</strong><span>Расчётный 1RM, кг</span></div></div><h4>Последние подходы</h4><div class="chart">${recent.map(s=>`<div class="baritem"><div class="barvalue" style="height:${Math.max(3,(Number(s.weight_kg)||0)/max*125)}px"></div><span class="barlabel">${s.weight_kg} кг</span></div>`).join('')}</div><div class="small">Последние ${recent.length} подходов</div></div>`}catch(e){el.innerHTML='<div class="card error">Не удалось загрузить прогресс. Выбери упражнение из списка.</div>'}}
load();
</script></body></html>
