<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MetaTrain</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--tg-theme-bg-color,#fff); color:var(--tg-theme-text-color,#111); padding:20px 16px calc(24px + env(safe-area-inset-bottom)); }
    main { max-width:560px; margin:auto; }
    h1 { font-size:28px; margin:0 0 4px; }
    .muted { color:var(--tg-theme-hint-color,#777); margin-bottom:20px; }
    .card { background:var(--tg-theme-secondary-bg-color,#f3f3f3); border-radius:18px; padding:18px; margin-bottom:14px; }
    .calories { font-size:34px; font-weight:700; }
    .bar { height:9px; background:rgba(127,127,127,.2); border-radius:99px; overflow:hidden; margin:12px 0 18px; }
    .fill { height:100%; width:0; background:var(--tg-theme-button-color,#2481cc); border-radius:99px; transition:width .4s; }
    .macros { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .macro strong { display:block; font-size:18px; }
    .macro span { font-size:12px; color:var(--tg-theme-hint-color,#777); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat strong { display:block; font-size:24px; }
    .stat span { color:var(--tg-theme-hint-color,#777); font-size:13px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button { border:0; border-radius:14px; padding:14px 10px; font-size:15px; font-weight:600; background:var(--tg-theme-button-color,#2481cc); color:var(--tg-theme-button-text-color,#fff); }
    .error { color:#d33; }
  </style>
</head>
<body>
<main>
  <h1 id="greeting">MetaTrain</h1>
  <div class="muted">Сегодня</div>

  <section class="card">
    <div class="muted">Калории</div>
    <div class="calories"><span id="calories">—</span> <small id="calorieTarget"></small></div>
    <div class="bar"><div class="fill" id="calorieFill"></div></div>
    <div class="macros">
      <div class="macro"><strong id="protein">—</strong><span>Белки</span></div>
      <div class="macro"><strong id="fat">—</strong><span>Жиры</span></div>
      <div class="macro"><strong id="carbs">—</strong><span>Углеводы</span></div>
    </div>
  </section>

  <section class="card stats">
    <div class="stat"><strong id="weight">—</strong><span>Текущий вес</span></div>
    <div class="stat"><strong id="workouts">—</strong><span>Тренировок за 7 дней</span></div>
  </section>

  <section class="card actions">
    <button onclick="tg.showAlert('Раздел питания — следующий этап')">🍽 Питание</button>
    <button onclick="tg.showAlert('Раздел тренировок — следующий этап')">🏋️ Тренировки</button>
    <button onclick="tg.showAlert('Раздел веса — следующий этап')">⚖️ Вес</button>
    <button onclick="tg.showAlert('Раздел прогресса — следующий этап')">📈 Прогресс</button>
  </section>
  <div id="error" class="error"></div>
</main>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || '';
const headers = { 'X-Telegram-Init-Data': initData };

function set(id, value) { document.getElementById(id).textContent = value; }
async function load() {
  if (!initData) { document.getElementById('error').textContent = 'Открой приложение внутри Telegram.'; return; }
  try {
    const [me, data] = await Promise.all([
      fetch('/api/me', {headers}).then(r => r.ok ? r.json() : Promise.reject(r)),
      fetch('/api/dashboard', {headers}).then(r => r.ok ? r.json() : Promise.reject(r))
    ]);
    set('greeting', `Привет, ${me.first_name || me.username || 'спортсмен'} 👋`);
    set('calories', Math.round(data.calories.current));
    set('calorieTarget', `/ ${Math.round(data.calories.target || 0)} ккал`);
    set('protein', `${Math.round(data.protein.current)} / ${Math.round(data.protein.target || 0)} г`);
    set('fat', `${Math.round(data.fat.current)} / ${Math.round(data.fat.target || 0)} г`);
    set('carbs', `${Math.round(data.carbohydrates.current)} / ${Math.round(data.carbohydrates.target || 0)} г`);
    set('weight', data.weight_kg == null ? '—' : `${data.weight_kg} кг`);
    set('workouts', data.workouts_last_7_days);
    const target = data.calories.target || 0;
    document.getElementById('calorieFill').style.width = `${Math.min(100, target ? data.calories.current / target * 100 : 0)}%`;
  } catch (e) { document.getElementById('error').textContent = 'Не удалось загрузить данные.'; }
}
load();
</script>
</body>
</html>
