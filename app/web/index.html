<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MetaTrain</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:20px 16px calc(24px + env(safe-area-inset-bottom))}main{max-width:560px;margin:auto}.screen{display:none}.screen.active{display:block}h1{font-size:28px;margin:0 0 4px}h2{font-size:24px;margin:0 0 18px}.muted{color:var(--tg-theme-hint-color,#777)}.card{background:var(--tg-theme-secondary-bg-color,#f3f3f3);border-radius:18px;padding:18px;margin-bottom:14px}.calories{font-size:34px;font-weight:700}.bar{height:9px;background:rgba(127,127,127,.2);border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;background:var(--tg-theme-button-color,#2481cc);border-radius:99px}.macros,.stats,.actions{display:grid;gap:10px}.macros{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.macro strong,.stat strong{display:block}.macro strong{font-size:18px}.stat strong{font-size:24px}.macro span,.stat span{font-size:12px;color:var(--tg-theme-hint-color,#777)}button,input,select{width:100%;border:0;border-radius:14px;padding:14px 12px;font-size:15px}button{font-weight:600;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.back{background:var(--tg-theme-secondary-bg-color,#f3f3f3);color:var(--tg-theme-text-color,#111);margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(127,127,127,.15)}.row:last-child{border-bottom:0}.form{display:grid;gap:10px}.error{color:#d33}.ok{color:#198754}.empty{text-align:center;padding:20px 0;color:var(--tg-theme-hint-color,#777)}.exercise{padding:14px 0;border-bottom:1px solid rgba(127,127,127,.15)}.exercise:last-child{border-bottom:0}.setrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-top:8px}.setrow input{padding:10px}.small{font-size:12px;color:var(--tg-theme-hint-color,#777)}
</style></head><body><main>
<section id="home" class="screen active"><h1 id="greeting">MetaTrain</h1><div class="muted" style="margin-bottom:20px">Сегодня</div><section class="card"><div class="muted">Калории</div><div class="calories"><span id="calories">—</span> <small id="calorieTarget"></small></div><div class="bar"><div class="fill" id="calorieFill"></div></div><div class="macros"><div class="macro"><strong id="protein">—</strong><span>Белки</span></div><div class="macro"><strong id="fat">—</strong><span>Жиры</span></div><div class="macro"><strong id="carbs">—</strong><span>Углеводы</span></div></div></section><section class="card stats"><div class="stat"><strong id="weight">—</strong><span>Текущий вес</span></div><div class="stat"><strong id="workouts">—</strong><span>Тренировок за 7 дней</span></div></section><section class="card actions"><button onclick="show('food')">🍽 Питание</button><button onclick="show('workouts')">🏋️ Тренировки</button><button onclick="show('weights')">⚖️ Вес</button><button onclick="show('progress')">📈 Прогресс</button></section></section>
<section id="food" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Питание</h2><div class="card"><div id="foodList" class="empty">Загрузка…</div></div></section>
<section id="workouts" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Тренировки</h2><div id="workoutList" class="card empty">Загрузка…</div><div class="card form"><input id="workoutName" placeholder="Название тренировки"><input id="workoutNotes" placeholder="Заметки"><button onclick="addWorkout()">Начать тренировку</button><div id="workoutMsg"></div></div><div id="activeWorkout"></div></section>
<section id="weights" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Вес</h2><div class="card"><div id="weightList" class="empty">Загрузка…</div></div><div class="card form"><input id="weightInput" type="number" min="1" max="300" step="0.1" placeholder="Вес, кг"><button onclick="addWeight()">Записать вес</button><div id="weightMsg"></div></div></section>
<section id="progress" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Прогресс</h2><div class="card"><div class="empty">Выбери упражнение в следующем этапе.</div></div></section><div id="error" class="error"></div></main>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?.initData||'';const headers={'X-Telegram-Init-Data':initData};let activeWorkoutId=null;
function set(id,v){document.getElementById(id).textContent=v}function show(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(name).classList.add('active');if(name==='food')loadFood();if(name==='workouts')loadWorkouts();if(name==='weights')loadWeights()}async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){if(!initData){set('error','Открой приложение внутри Telegram.');return}try{const[me,d]=await Promise.all([api('/api/me'),api('/api/dashboard')]);set('greeting',`Привет, ${me.first_name||me.username||'спортсмен'} 👋`);set('calories',Math.round(d.calories.current));set('calorieTarget',`/ ${Math.round(d.calories.target||0)} ккал`);set('protein',`${Math.round(d.protein.current)} / ${Math.round(d.protein.target||0)} г`);set('fat',`${Math.round(d.fat.current)} / ${Math.round(d.fat.target||0)} г`);set('carbs',`${Math.round(d.carbohydrates.current)} / ${Math.round(d.carbohydrates.target||0)} г`);set('weight',d.weight_kg==null?'—':`${d.weight_kg} кг`);set('workouts',d.workouts_last_7_days);const t=d.calories.target||0;document.getElementById('calorieFill').style.width=`${Math.min(100,t?d.calories.current/t*100:0)}%`}catch(e){set('error','Не удалось загрузить данные.')}}
async function loadFood(){try{const d=await api('/api/food/today'),el=document.getElementById('foodList');if(!d.items.length){el.textContent='Сегодня ещё ничего не записано.';return}el.innerHTML=d.items.map(x=>`<div class="row"><span>${x.product_name}<br><small>${x.meal}, ${x.grams} г</small></span><strong>${Math.round(x.calories)} ккал</strong></div>`).join('')}catch(e){set('foodList','Не удалось загрузить питание.')}}
async function loadWorkouts(){try{const d=await api('/api/workouts'),el=document.getElementById('workoutList');if(!d.items.length){el.textContent='Тренировок пока нет.';return}el.innerHTML=d.items.map(x=>`<div class="row"><button onclick="openWorkout(${x.id})">${x.name}</button><span>${new Date(x.performed_at).toLocaleDateString('ru-RU')}</span></div>`).join('')}catch(e){set('workoutList','Не удалось загрузить тренировки.')}}
async function addWorkout(){const msg=document.getElementById('workoutMsg');try{const x=await api('/api/workouts',{method:'POST',body:JSON.stringify({name:workoutName.value,notes:workoutNotes.value||null})});activeWorkoutId=x.id;msg.className='ok';msg.textContent='Тренировка создана ✓';workoutName.value='';workoutNotes.value='';await loadWorkouts();await openWorkout(activeWorkoutId)}catch(e){msg.className='error';msg.textContent='Не удалось создать тренировку.'}}
async function openWorkout(id){activeWorkoutId=id;const d=await api(`/api/workouts/${id}`),el=document.getElementById('activeWorkout');el.innerHTML=`<div class="card"><h3>${d.workout.name}</h3><div id="exerciseList">${d.exercises.map(renderExercise).join('')}</div><div class="form" style="margin-top:12px"><input id="exerciseName" placeholder="Новое упражнение"><button onclick="addExercise()">Добавить упражнение</button></div></div>`}
function renderExercise(x){return `<div class="exercise"><strong>${x.name}</strong><div id="sets-${x.id}"></div><div class="setrow"><input id="w-${x.id}" type="number" min="0" step="0.5" placeholder="кг"><input id="r-${x.id}" type="number" min="1" placeholder="повт."><input id="rpe-${x.id}" type="number" min="1" max="10" step="0.5" placeholder="RPE"><button onclick="addSet(${x.id})">+</button></div></div>`}
async function addExercise(){const name=document.getElementById('exerciseName').value.trim();if(!name||!activeWorkoutId)return;const d=await api('/api/workouts/exercises',{method:'POST',body:JSON.stringify({workout_id:activeWorkoutId,name,position:document.querySelectorAll('.exercise').length+1})});document.getElementById('exerciseName').value='';await openWorkout(activeWorkoutId)}
async function addSet(exerciseId){const w=document.getElementById(`w-${exerciseId}`),r=document.getElementById(`r-${exerciseId}`),rpe=document.getElementById(`rpe-${exerciseId}`);const setCount=document.querySelectorAll(`#sets-${exerciseId} .row`).length;await api('/api/workouts/sets',{method:'POST',body:JSON.stringify({exercise_id:exerciseId,set_number:setCount+1,weight_kg:+w.value,reps:+r.value,rpe:rpe.value?+rpe.value:null})});w.value='';r.value='';rpe.value='';await openWorkout(activeWorkoutId)}
async function loadWeights(){try{const d=await api('/api/weights'),el=document.getElementById('weightList');if(!d.items.length){el.textContent='История веса пуста.';return}el.innerHTML=d.items.map(x=>`<div class="row"><span>${new Date(x.measured_at).toLocaleDateString('ru-RU')}</span><strong>${x.weight_kg} кг</strong></div>`).join('')}catch(e){set('weightList','Не удалось загрузить вес.')}}
async function addWeight(){const msg=document.getElementById('weightMsg');try{await api('/api/weights',{method:'POST',body:JSON.stringify({weight_kg:+weightInput.value})});msg.className='ok';msg.textContent='Вес записан ✓';weightInput.value='';await loadWeights();await load()}catch(e){msg.className='error';msg.textContent='Не удалось записать вес.')}}load();
</script></body></html>
