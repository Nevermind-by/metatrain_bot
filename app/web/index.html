<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MetaTrain</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:20px 16px calc(24px + env(safe-area-inset-bottom))}main{max-width:560px;margin:auto}.screen{display:none}.screen.active{display:block}h1{font-size:28px;margin:0 0 4px}h2{font-size:24px;margin:0 0 18px}.muted{color:var(--tg-theme-hint-color,#777)}.card{background:var(--tg-theme-secondary-bg-color,#f3f3f3);border-radius:18px;padding:18px;margin-bottom:14px}.calories{font-size:34px;font-weight:700}.bar{height:9px;background:rgba(127,127,127,.2);border-radius:99px;overflow:hidden;margin:12px 0 18px}.fill{height:100%;width:0;background:var(--tg-theme-button-color,#2481cc);border-radius:99px}.macros,.stats,.actions{display:grid;gap:10px}.macros{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.macro strong,.stat strong{display:block}.macro strong{font-size:18px}.stat strong{font-size:24px}.macro span,.stat span{font-size:12px;color:var(--tg-theme-hint-color,#777)}button{border:0;border-radius:14px;padding:14px 10px;font-size:15px;font-weight:600;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.back{background:var(--tg-theme-secondary-bg-color,#f3f3f3);color:var(--tg-theme-text-color,#111);margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(127,127,127,.15)}.row:last-child{border:0}.empty{text-align:center;padding:20px 0;color:var(--tg-theme-hint-color,#777)}.error{color:#d33}</style>
</head><body><main>
<section id="home" class="screen active"><h1 id="greeting">MetaTrain</h1><div class="muted" style="margin-bottom:20px">Сегодня</div><section class="card"><div class="muted">Калории</div><div class="calories"><span id="calories">—</span> <small id="calorieTarget"></small></div><div class="bar"><div class="fill" id="calorieFill"></div></div><div class="macros"><div class="macro"><strong id="protein">—</strong><span>Белки</span></div><div class="macro"><strong id="fat">—</strong><span>Жиры</span></div><div class="macro"><strong id="carbs">—</strong><span>Углеводы</span></div></div></section><section class="card stats"><div class="stat"><strong id="weight">—</strong><span>Текущий вес</span></div><div class="stat"><strong id="workouts">—</strong><span>Тренировок за 7 дней</span></div></section><section class="card actions"><button onclick="show('food')">🍽 Питание</button><button onclick="show('workouts')">🏋️ Тренировки</button><button onclick="show('weights')">⚖️ Вес</button><button onclick="show('progress')">📈 Прогресс</button></section></section>
<section id="food" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Питание</h2><div class="card"><div id="foodList" class="empty">Загрузка…</div></div></section>
<section id="workouts" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Тренировки</h2><div class="card"><div id="workoutList" class="empty">Загрузка…</div></div></section>
<section id="weights" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Вес</h2><div class="card"><div id="weightList" class="empty">Загрузка…</div></div></section>
<section id="progress" class="screen"><button class="back" onclick="show('home')">← Главная</button><h2>Прогресс</h2><div class="card"><div class="empty">Выбери упражнение в следующей версии.</div></div></section><div id="error" class="error"></div></main>
<script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const headers={'X-Telegram-Init-Data':tg?.initData||''};const set=(id,v)=>document.getElementById(id).textContent=v;function show(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(name).classList.add('active');if(name==='food')loadFood();if(name==='workouts')loadWorkouts();if(name==='weights')loadWeights()}async function api(path){const r=await fetch(path,{headers});if(!r.ok)throw Error();return r.json()}async function load(){if(!headers['X-Telegram-Init-Data'])return set('error','Открой приложение внутри Telegram.');try{const [me,d]=await Promise.all([api('/api/me'),api('/api/dashboard')]);set('greeting',`Привет, ${me.first_name||me.username||'спортсмен'} 👋`);set('calories',Math.round(d.calories.current));set('calorieTarget',`/ ${Math.round(d.calories.target||0)} ккал`);set('protein',`${Math.round(d.protein.current)} / ${Math.round(d.protein.target||0)} г`);set('fat',`${Math.round(d.fat.current)} / ${Math.round(d.fat.target||0)} г`);set('carbs',`${Math.round(d.carbohydrates.current)} / ${Math.round(d.carbohydrates.target||0)} г`);set('weight',d.weight_kg==null?'—':`${d.weight_kg} кг`);set('workouts',d.workouts_last_7_days);const t=d.calories.target||0;document.getElementById('calorieFill').style.width=`${Math.min(100,t?d.calories.current/t*100:0)}%`}catch(e){set('error','Не удалось загрузить данные.')}}async function loadFood(){try{const d=await api('/api/food/today'),el=document.getElementById('foodList');el.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><span>${x.product_name}<br><small>${x.meal}, ${x.grams} г</small></span><strong>${Math.round(x.calories)} ккал</strong></div>`).join(''):'Сегодня ещё ничего не записано.'}catch(e){set('foodList','Не удалось загрузить питание.')}}async function loadWorkouts(){try{const d=await api('/api/workouts'),el=document.getElementById('workoutList');el.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><span>${x.name}</span><span>${new Date(x.performed_at).toLocaleDateString('ru-RU')}</span></div>`).join(''):'Тренировок пока нет.'}catch(e){set('workoutList','Не удалось загрузить тренировки.')}}async function loadWeights(){try{const d=await api('/api/weights'),el=document.getElementById('weightList');el.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><span>${new Date(x.measured_at).toLocaleDateString('ru-RU')}</span><strong>${x.weight_kg} кг</strong></div>`).join(''):'История веса пуста.'}catch(e){set('weightList','Не удалось загрузить вес.')}}load();</script></body></html>
