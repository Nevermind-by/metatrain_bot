[project]
name = "metatrain-bot"
version = "0.1.0"
description = "Telegram bot for calorie tracking, nutrition management and workout progress."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.0",
    "fastapi>=0.116.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["docker*"]
