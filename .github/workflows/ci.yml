name: CI

on:
  push:
    branches: [main, feature/food-final4]
  pull_request:

env:
  BOT_TOKEN: "123456789:CI_TEST_TOKEN"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install -e .

      - name: Install Ruff
        run: python -m pip install "ruff>=0.15.20"

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run Ruff
        run: ruff check .
